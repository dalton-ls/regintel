# Deploy the site + admin API

on:
  push:
    branches:
      - claude/create-website-skeleton-hYJMa
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: af9d5fca4b1386360ed10ebc7e96c435
          command: deploy
      - name: Smoke admin API
        run: |
          set -e
          origin="https://regintel.regintel.workers.dev"
          health="$(curl -fsS --max-time 20 "$origin/api/health")"
          echo "$health"
          echo "$health" | grep -q '"githubAuth":"ok"'
          curl -fsS -o /dev/null --max-time 45 "$origin/api/file?path=requirements.json"
          curl -fsS -o /dev/null --max-time 45 "$origin/requirements.json"
