# Deploy the site + admin API to Cloudflare Pages

on:
  push:
    branches:
      - claude/create-website-skeleton-hYJMa
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: af9d5fca4b1386360ed10ebc7e96c435
          command: deploy
