name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate data files
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          for (const f of ["requirements.json", "wr.json"]) {
            const raw = fs.readFileSync(f, "utf8");
            if (/^(<<<<<<<|=======|>>>>>>>)/m.test(raw)) {
              console.error(`::error file=${f}::Merge conflict markers in ${f}`);
              process.exit(1);
            }
            try {
              JSON.parse(raw);
            } catch (err) {
              console.error(`::error file=${f}::Invalid JSON: ${err.message}`);
              process.exit(1);
            }
            console.log("ok", f);
          }
          const maxAsset = 25 * 1024 * 1024;
          const skipDirs = new Set([".git", ".github", ".cursor", ".wrangler", "node_modules", "worker", "functions", "src", "scripts"]);
          const ignoreLines = fs.readFileSync(".assetsignore", "utf8").split(/\r?\n/).map((line) => line.replace(/#.*$/, "").trim()).filter(Boolean);
          function ignored(rel) {
            const posix = rel.split(path.sep).join("/");
            return ignoreLines.some((line) => posix === line || posix.startsWith(line.replace(/\/$/, "") + "/") || posix.split("/").includes(line.replace(/\/$/, "")));
          }
          function walk(dir) {
            for (const name of fs.readdirSync(dir)) {
              if (skipDirs.has(name)) continue;
              const full = path.join(dir, name);
              const st = fs.statSync(full);
              const rel = path.relative(".", full);
              if (st.isDirectory()) {
                if (!ignored(rel)) walk(full);
                continue;
              }
              if (st.size <= maxAsset) continue;
              if (ignored(rel)) {
                console.log("ok oversized ignored asset", rel, st.size);
                continue;
              }
              console.error(`::error file=${rel}::${rel} is ${(st.size / 1048576).toFixed(2)} MiB; Workers assets max is 25 MiB. Serve it from GitHub and add it to .assetsignore.`);
              process.exit(1);
            }
          }
          walk(".");
          NODE
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
      - name: Smoke admin API
        run: |
          set -euo pipefail
          origin="https://regintel.regintel.workers.dev"
          curl_ok() {
            local url="$1" max="$2" out="$3"
            local code
            code="$(curl -sS -o "$out" -w "%{http_code}" --max-time "$max" "$url" || true)"
            echo "$url -> HTTP $code"
            if [ -z "$code" ] || [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              head -c 800 "$out"; echo
              return 1
            fi
          }
          health="$(mktemp)"
          curl_ok "$origin/api/health" 20 "$health"
          grep -q '"githubAuth":"ok"' "$health"
          curl_ok "$origin/requirements.json" 45 /dev/null
          fileout="$(mktemp)"
          ok=0
          for i in 1 2 3 4 5; do
            if curl_ok "$origin/api/file?path=requirements.json" 45 "$fileout"; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::warning::Worker is up, but /api/file failed. GitHub JSON may be invalid or over the contents API size limit."
          fi
