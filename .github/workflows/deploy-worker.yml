name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate data files
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          function noConflict(raw, f) {
            if (/^(<<<<<<<|=======|>>>>>>>)/m.test(raw)) {
              console.error(`::error file=${f}::Merge conflict markers in ${f}`);
              process.exit(1);
            }
          }
          const wr = fs.readFileSync("wr.json", "utf8");
          noConflict(wr, "wr.json");
          JSON.parse(wr);
          console.log("ok wr.json");
          const stub = JSON.parse(fs.readFileSync("requirements.json", "utf8"));
          if (Array.isArray(stub)) {
            console.error("::error file=requirements.json::Legacy array still present; run python scripts/requirements_store.py --from-legacy --write");
            process.exit(1);
          }
          const manifest = JSON.parse(fs.readFileSync("requirements/manifest.json", "utf8"));
          const budget = manifest.budgetBytes || 10 * 1024 * 1024;
          let total = 0;
          for (const shard of manifest.shards || []) {
            const rel = shard.path;
            const raw = fs.readFileSync(rel, "utf8");
            noConflict(raw, rel);
            const lines = raw.split(/\r?\n/).filter(Boolean);
            for (const line of lines) JSON.parse(line);
            const size = fs.statSync(rel).size;
            total += lines.length;
            if (size > budget) {
              console.error(`::error file=${rel}::${rel} is ${(size / 1048576).toFixed(2)} MiB; shard budget is ${(budget / 1048576).toFixed(1)} MiB. Re-split with scripts/requirements_store.py`);
              process.exit(1);
            }
            console.log("ok", rel, lines.length, size);
          }
          const index = JSON.parse(fs.readFileSync("requirements/index.json", "utf8"));
          if ((index.recordCount || 0) !== total || (manifest.recordCount || 0) !== total) {
            console.error("::error::index/manifest recordCount does not match shard rows", index.recordCount, manifest.recordCount, total);
            process.exit(1);
          }
          console.log("ok sharded requirements", total);
          const maxAsset = 25 * 1024 * 1024;
          const skipDirs = new Set([".git", ".github", ".cursor", ".wrangler", "node_modules", "worker", "functions", "src", "scripts", "requirements"]);
          const ignoreLines = fs.readFileSync(".assetsignore", "utf8").split(/\r?\n/).map((line) => line.replace(/#.*$/, "").trim()).filter(Boolean);
          function ignored(rel) {
            const posix = rel.split(path.sep).join("/");
            return ignoreLines.some((line) => posix === line || posix.startsWith(line.replace(/\/$/, "") + "/") || posix.split("/").includes(line.replace(/\/$/, "")));
          }
          function walk(dir) {
            for (const name of fs.readdirSync(dir)) {
              if (skipDirs.has(name)) continue;
              const full = path.join(dir, name);
              const st = fs.statSync(full);
              const rel = path.relative(".", full);
              if (st.isDirectory()) {
                if (!ignored(rel)) walk(full);
                continue;
              }
              if (st.size <= maxAsset) continue;
              if (ignored(rel)) {
                console.log("ok oversized ignored asset", rel, st.size);
                continue;
              }
              console.error(`::error file=${rel}::${rel} is ${(st.size / 1048576).toFixed(2)} MiB; Workers assets max is 25 MiB. Serve it from GitHub and add it to .assetsignore.`);
              process.exit(1);
            }
          }
          walk(".");
          NODE
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
      - name: Smoke admin API
        run: |
          set -euo pipefail
          origin="https://regintel.regintel.workers.dev"
          curl_ok() {
            local url="$1" max="$2" out="$3"
            local code
            code="$(curl -sS -o "$out" -w "%{http_code}" --max-time "$max" "$url" || true)"
            echo "$url -> HTTP $code"
            if [ -z "$code" ] || [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              head -c 800 "$out"; echo
              return 1
            fi
          }
          health="$(mktemp)"
          curl_ok "$origin/api/health" 20 "$health"
          grep -q '"githubAuth":"ok"' "$health"
          curl_ok "$origin/requirements.json" 90 /dev/null
          fileout="$(mktemp)"
          ok=0
          for i in 1 2 3 4 5; do
            if curl_ok "$origin/api/file?path=requirements.json" 90 "$fileout"; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::warning::Worker is up, but /api/file failed. GitHub JSON may be invalid or over the contents API size limit."
          fi
