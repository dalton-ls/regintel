name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - claude/create-website-skeleton-hYJMa
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
      - name: Smoke admin API
        run: |
          set -e
          origin="https://regintel.regintel.workers.dev"
          health="$(curl -fsS --max-time 20 "$origin/api/health")"
          echo "$health"
          echo "$health" | grep -q '"githubAuth":"ok"'
          curl -fsS -o /dev/null --max-time 45 "$origin/api/file?path=requirements.json"
          curl -fsS -o /dev/null --max-time 45 "$origin/requirements.json"
