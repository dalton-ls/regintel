name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - claude/create-website-skeleton-hYJMa
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Validate data files
        run: |
          node -e "for (const f of ['requirements.json','wr.json']) { JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('ok', f); }"
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
      - name: Smoke admin API
        run: |
          set -euo pipefail
          origin="https://regintel.regintel.workers.dev"
          curl_ok() {
            local url="$1" max="$2" out="$3"
            local code
            code="$(curl -sS -o "$out" -w "%{http_code}" --max-time "$max" "$url" || true)"
            echo "$url -> HTTP $code"
            if [ -z "$code" ] || [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              head -c 800 "$out"; echo
              return 1
            fi
          }
          health="$(mktemp)"
          curl_ok "$origin/api/health" 20 "$health"
          grep -q '"githubAuth":"ok"' "$health"
          fileout="$(mktemp)"
          ok=0
          for i in 1 2 3 4 5; do
            if curl_ok "$origin/api/file?path=requirements.json" 45 "$fileout"; then
              ok=1
              break
            fi
            sleep 5
          done
          [ "$ok" -eq 1 ]
          curl_ok "$origin/requirements.json" 45 /dev/null
