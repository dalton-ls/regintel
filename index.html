<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RegIntel | Home</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #1a2332;
      background: #f0f2f5;
    }
    .app-header {
      height: 60px;
      background: #1a2e5a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      position: sticky; top: 0; z-index: 20;
    }
    .header-brand { display: flex; align-items: center; gap: 10px; }
    .logo-text { font-size: 17px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
    .header-sep { color: rgba(255,255,255,0.25); font-size: 20px; font-weight: 200; }
    .header-subtitle { font-size: 12px; color: rgba(255,255,255,0.6); }
    .header-link {
      font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.65);
      text-decoration: none; padding: 6px 12px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .header-link:hover { background: rgba(255,255,255,0.08); color: #fff; }
    main { max-width: 1100px; margin: 0 auto; padding: 80px 24px; }
    .empty-state { text-align: center; color: #6b7a99; }
    .empty-state h1 {
      font-size: 22px; font-weight: 700; color: #1a2332; margin-bottom: 8px;
    }
    .empty-state p { line-height: 1.6; max-width: 36rem; margin: 0 auto; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-brand">
      <span class="logo-text">RegIntel</span>
      <span class="header-sep">|</span>
      <span class="header-subtitle">Home</span>
    </div>
    <a class="header-link" href="regintel.html">Open research view →</a>
  </header>
  <main>
    <div class="empty-state">
      <h1>Home</h1>
      <p>This page is not populated yet. Quality Manager monitoring lives in the research view under Intelligence → Quality Monitor.</p>
    </div>
  </main>
</body>
</html>
